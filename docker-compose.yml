services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro   # init scripts create per-service DBs
    ports:
      - "5432:5432"
    networks:
      - demo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka (KRaft mode, single-node) ─────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: demo-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - demo-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s    

  # ── Service Registry (Eureka) ───────────────────────────────────────────────
  service-registry:
    build:
      context: ./backend/DemoMicroserviceProject/service-registry
      dockerfile: Dockerfile
    image: anadinatu/demo-service-registry:latest  
    container_name: demo-service-registry
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - "8761:8761"
    networks:
      - demo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Auth Service ────────────────────────────────────────────────────────────
    # ── Auth Service ────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/DemoMicroserviceProject/auth-service
      dockerfile: Dockerfile
    image: anadinatu/demo-auth-service:latest
    container_name: demo-auth-service

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      # Database
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Frontend
      APP_FRONTEND_URL: ${FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}

      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Github OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}

    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      kafka:                          # added
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Demo Service 1 ──────────────────────────────────────────────────────────
  demo-service-1:
    build:
      context: ./backend/DemoMicroserviceProject/demo-service_1
      dockerfile: Dockerfile
    image: anadinatu/demo-service-1:latest  
    container_name: demo-service-1
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_HOST:          ${POSTGRES_HOST}
      POSTGRES_PORT:          ${POSTGRES_PORT}
      DEMO1_DB_NAME:          ${DEMO1_DB_NAME}
      DEMO1_DB_USER:          ${DEMO1_DB_USER}
      DEMO1_DB_PASSWORD:      ${DEMO1_DB_PASSWORD}
      JWT_SECRET:             ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME:  ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:     ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET:  ${CLOUDINARY_API_SECRET}
    networks:
      - demo-network
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      kafka:                          # added
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Demo Service 2 ──────────────────────────────────────────────────────────
  demo-service-2:
    build:
      context: ./backend/DemoMicroserviceProject/demo-service_2
      dockerfile: Dockerfile
    image: anadinatu/demo-service-2:latest
    container_name: demo-service-2
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_HOST:          ${POSTGRES_HOST}
      POSTGRES_PORT:          ${POSTGRES_PORT}
      DEMO2_DB_NAME:          ${DEMO2_DB_NAME}
      DEMO2_DB_USER:          ${DEMO2_DB_USER}
      DEMO2_DB_PASSWORD:      ${DEMO2_DB_PASSWORD}
      JWT_SECRET:             ${JWT_SECRET}
    networks:
      - demo-network
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      kafka:                          # added
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/DemoMicroserviceProject/api-gateway
      dockerfile: Dockerfile
    image: anadinatu/demo-api-gateway:latest

    container_name: demo-api-gateway

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8083:8083"

    depends_on:
      auth-service:
        condition: service_healthy
      demo-service-1:
        condition: service_healthy
      demo-service-2:
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend (Angular + Nginx) ──────────────────────────────────────────────
  # FIX: was incorrectly pointing to api-gateway context — now points to frontend folder.
  # Your Angular project must have its own Dockerfile at this path.
    # ── Frontend ───────────────────────────────────────────────
  frontend:
   build:
     context: ./frontend/angular-product-management
     dockerfile: Dockerfile

   image: anadinatu/demo-frontend:latest

   container_name: demo-frontend

   restart: unless-stopped

   ports:
     - "80:80"
     - "443:443"

   volumes:
     - /etc/letsencrypt:/etc/letsencrypt:ro

   depends_on:
     api-gateway:
       condition: service_healthy

   networks:
     - demo-network

   healthcheck:
     test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
     interval: 30s
     timeout: 5s
     retries: 3
     start_period: 15s

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  kafka-data:            # added
    driver: local

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  demo-network:
    driver: bridge
    name: demo-network