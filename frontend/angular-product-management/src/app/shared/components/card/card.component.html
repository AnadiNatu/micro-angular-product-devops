<nz-card
  [ngClass]="getCardClasses()"
  [appHighlight]="isFeatured ? '#e8f5e9' : ''"
  [nzBordered]="true"
  class="shared-card"
>
  <!-- Card Header -->
  <div class="card-header">

    <h5 class="card-title">
      {{ title | titlecase }}
    </h5>

    @if (isFeatured) {
      <nz-tag
        nzColor="success"
        class="featured-tag"
      >
        <span
          nz-icon
          nzType="star"
          nzTheme="fill"
        ></span>

        <span>Featured</span>
      </nz-tag>
    }

  </div>

  <!-- Projected Card Content -->
  <div class="card-content">
    <ng-content select="[card-body]"></ng-content>
  </div>

  <!-- Card Footer -->
  <div class="card-footer">

    <button
      nz-button
      nzType="primary"
      nzSize="small"
      nzBlock
      [disabled]="disableAction"
      (click)="onActionClick($event)"
    >
      <span
        nz-icon
        nzType="arrow-right"
        nzTheme="outline"
      ></span>

      <span>{{ actionLabel }}</span>
    </button>

  </div>
</nz-card>
