services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Eureka Service Registry
  # ─────────────────────────────────────────────────────────────────────────────
  service-registry:
    image: anadinatu/demo-service-registry:latest
    container_name: demo-service-registry
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

    ports:
      - "8761:8761"

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # ─────────────────────────────────────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────────────────────────────────────
  auth-service:
    image: anadinatu/demo-auth-service:latest
    container_name: demo-auth-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      APP_FRONTEND_URL: ${FRONTEND_URL}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  # ─────────────────────────────────────────────────────────────────────────────
  # Demo Service 1
  # ─────────────────────────────────────────────────────────────────────────────
  demo-service-1:
    image: anadinatu/demo-service-1:latest
    container_name: demo-service-1
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      DEMO1_DB_NAME: ${DEMO1_DB_NAME}
      DEMO1_DB_USER: ${DEMO1_DB_USER}
      DEMO1_DB_PASSWORD: ${DEMO1_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  # ─────────────────────────────────────────────────────────────────────────────
  # Demo Service 2
  # ─────────────────────────────────────────────────────────────────────────────
  demo-service-2:
    image: anadinatu/demo-service-2:latest
    container_name: demo-service-2
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

      DEMO2_DB_NAME: ${DEMO2_DB_NAME}
      DEMO2_DB_USER: ${DEMO2_DB_USER}
      DEMO2_DB_PASSWORD: ${DEMO2_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  # ─────────────────────────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────────────────────────
  api-gateway:
    image: anadinatu/demo-api-gateway:latest
    container_name: demo-api-gateway
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8083:8083"

    depends_on:
      auth-service:
        condition: service_healthy
      demo-service-1:
        condition: service_healthy
      demo-service-2:
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # ─────────────────────────────────────────────────────────────────────────────
  # Angular Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    image: anadinatu/demo-frontend:latest
    container_name: demo-frontend
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      api-gateway:
        condition: service_healthy

    networks:
      - demo-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


networks:
  demo-network:
    driver: bridge
    name: demo-network